<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sardisans Map v1.5.3</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');
  :root{--panel:rgba(10,11,14,.95);--border:rgba(180,140,60,.35);--gold:#c9a84c;--text:#d4c5a0;--text-dim:#8a7a60;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body,html{height:100%;overflow:hidden;background:#111;font-family:'Crimson Text',Georgia,serif;color:var(--text);display:flex;flex-direction:column;}
  #map-wrap{position:relative;flex:1;overflow:hidden;min-height:0;}
  #map{width:100%;height:100%;background:#1a1610;}
  #footer{height:40px;flex-shrink:0;background:rgba(8,9,11,.98);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:12px;z-index:1000;}
  #coords-display{font-family:'Crimson Text',serif;font-size:14px;color:var(--text-dim);white-space:nowrap;min-width:200px;}
  #version-display{font-family:'Cinzel',serif;font-size:12px;letter-spacing:1.5px;color:var(--gold);white-space:nowrap;font-weight:700;}
  #sync-text.ok{color:#27ae60;} #sync-text.busy{color:var(--gold);} #sync-text.err{color:#e74c3c;}
  #zoom-controls{display:flex;gap:4px;flex-shrink:0;}
  .zoom-btn{width:32px;height:28px;background:transparent;border:1px solid var(--border);color:var(--text-dim);font-size:18px;border-radius:3px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;}
  .zoom-btn:hover{color:var(--gold);border-color:var(--gold);}
  #panel{position:absolute;top:16px;right:16px;z-index:1000;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:16px;width:270px;backdrop-filter:blur(8px);box-shadow:0 4px 24px rgba(0,0,0,.6);max-height:calc(100% - 32px);overflow-y:auto;}
  #panel::-webkit-scrollbar{width:4px;}
  #panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
  #panel h2{font-family:'Cinzel',serif;font-size:15px;letter-spacing:2px;color:var(--gold);text-align:center;margin-bottom:8px;text-transform:uppercase;}
  #right-click-hint{font-size:12px;color:var(--text-dim);text-align:center;margin-bottom:12px;}
  #name-input{width:100%;padding:7px 9px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:3px;color:var(--text);font-family:'Crimson Text',serif;font-size:15px;outline:none;margin-bottom:6px;transition:border-color .2s;}
  #name-input::placeholder{color:var(--text-dim);}
  #name-input:focus{border-color:var(--gold);}
  #role-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  #role-display{font-family:'Cinzel',serif;letter-spacing:1px;font-size:11px;text-transform:uppercase;color:var(--text-dim);}
  #logout-btn{background:transparent;border:1px solid var(--border);color:var(--text-dim);font-family:'Cinzel',serif;font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border-radius:3px;cursor:pointer;transition:all .2s;}
  #logout-btn:hover{color:var(--gold);border-color:var(--gold);}
  #search{width:100%;padding:8px 10px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:'Crimson Text',serif;font-size:16px;outline:none;margin-bottom:10px;}
  #search::placeholder{color:var(--text-dim);}
  #filter-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  #filter-header-label{font-family:'Cinzel',serif;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);}
  #all-toggle-label{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--text-dim);cursor:pointer;user-select:none;}
  #filters{margin-bottom:10px;}
  .cat-row{display:flex;align-items:center;gap:8px;padding:5px 2px;cursor:pointer;border-radius:3px;transition:background .15s;}
  .cat-row:hover{background:rgba(255,255,255,.04);}
  .cat-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;border:1px solid rgba(255,255,255,.2);}
  .cat-row span{font-size:15px;color:var(--text);flex:1;}
  .cat-count{font-size:13px;color:var(--text-dim);min-width:18px;text-align:right;}
  .cat-toggle{appearance:none;-webkit-appearance:none;width:16px;height:16px;border:1px solid var(--border);border-radius:3px;background:transparent;cursor:pointer;flex-shrink:0;position:relative;}
  .cat-toggle:checked{background:var(--gold);border-color:var(--gold);}
  .cat-toggle:checked::after{content:'\2713';position:absolute;top:0;left:2px;font-size:11px;color:#000;}
  #opacity-row{margin-bottom:10px;}
  #opacity-row-label{font-size:12px;color:var(--text-dim);letter-spacing:.5px;margin-bottom:6px;}
  #opacity-slider{-webkit-appearance:none;appearance:none;width:100%;height:2px;background:rgba(201,168,76,.35);border-radius:1px;outline:none;cursor:pointer;display:block;}
  #opacity-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:3px;height:16px;background:var(--gold);cursor:pointer;border-radius:1px;border:none;}
  #opacity-slider::-moz-range-thumb{width:3px;height:16px;background:var(--gold);border:none;cursor:pointer;border-radius:1px;}
  .grid-toggle-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;cursor:pointer;}
  .grid-toggle-row span{font-size:14px;color:var(--text-dim);}
  .divider{border:none;border-top:1px solid var(--border);margin:10px 0;}
  #hidden-toggle{width:100%;background:transparent;border:1px solid var(--border);color:var(--text-dim);font-family:'Cinzel',serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:8px 10px;border-radius:4px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:all .2s;}
  #hidden-toggle:hover{color:var(--gold);border-color:var(--gold);}
  #hidden-toggle .arrow{transition:transform .2s;font-size:10px;}
  #hidden-toggle.open .arrow{transform:rotate(180deg);}
  #hidden-list{display:none;margin-top:6px;} #hidden-list.open{display:block;}
  .hidden-item{display:flex;align-items:center;gap:6px;padding:6px 2px;border-bottom:1px solid rgba(180,140,60,.12);}
  .hidden-item:last-child{border-bottom:none;}
  .hidden-item-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .hidden-item-name{font-size:14px;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hidden-item-btns{display:flex;gap:4px;flex-shrink:0;}
  .hi-btn{padding:3px 8px;font-family:'Cinzel',serif;font-size:11px;border-radius:3px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text-dim);transition:all .2s;}
  .hi-btn.restore:hover{color:#27ae60;border-color:#27ae60;} .hi-btn.del:hover{color:#e74c3c;border-color:#e74c3c;}
  #hidden-empty{font-size:14px;color:var(--text-dim);text-align:center;padding:8px 0;}
  .grid-label{color:rgba(230,210,155,.95);font-family:'Cinzel',serif;font-size:12px;font-weight:700;text-align:center;pointer-events:none !important;text-shadow:0 0 4px #000,0 1px 2px #000;background:transparent;border:none;line-height:1;}
  #status{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:1001;background:rgba(10,11,14,.9);border:1px solid var(--gold);border-radius:4px;padding:8px 18px;font-family:'Cinzel',serif;font-size:13px;letter-spacing:1px;color:var(--gold);opacity:0;transition:opacity .3s;pointer-events:none;}
  #status.show{opacity:1;}
  /* Debug log */
  #debug-panel{position:fixed;bottom:48px;right:0;width:340px;z-index:5000;font-family:monospace;font-size:11px;}
  #debug-header{background:#1a1c20;border:1px solid #444;border-bottom:none;padding:4px 10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;color:#aaa;border-radius:4px 4px 0 0;}
  #debug-header span{color:var(--gold);font-weight:bold;}
  #debug-body{background:rgba(10,11,14,.97);border:1px solid #444;max-height:200px;overflow-y:auto;padding:6px;border-radius:0 0 0 4px;}
  #debug-body.collapsed{display:none;}
  .dlog{padding:2px 0;border-bottom:1px solid rgba(255,255,255,.05);word-break:break-all;}
  .dlog.info{color:#aaa;} .dlog.ok{color:#27ae60;} .dlog.err{color:#e74c3c;} .dlog.warn{color:#e67e22;}
  #debug-copy{background:transparent;border:1px solid #444;color:#aaa;font-size:10px;padding:2px 6px;cursor:pointer;border-radius:3px;}
  #debug-copy:hover{color:#fff;}
  /* Modal */
  #modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:2000;align-items:center;justify-content:center;backdrop-filter:blur(3px);}
  #modal-overlay.open{display:flex;}
  #modal{background:#131518;border:1px solid var(--border);border-radius:8px;padding:32px 40px;width:780px;max-width:96vw;box-shadow:0 16px 48px rgba(0,0,0,.8);position:relative;}
  #modal-close{position:absolute;top:14px;right:16px;background:transparent;border:none;color:var(--text-dim);font-size:24px;cursor:pointer;line-height:1;padding:2px 6px;border-radius:3px;transition:color .2s;}
  #modal-close:hover{color:#e74c3c;}
  #modal h3{font-family:'Cinzel',serif;color:var(--gold);font-size:18px;letter-spacing:2px;margin-bottom:24px;text-align:center;text-transform:uppercase;padding-right:28px;}
  .form-group{margin-bottom:18px;}
  .form-group label{display:block;font-size:14px;letter-spacing:1px;color:var(--text-dim);text-transform:uppercase;margin-bottom:8px;}
  .form-group input,.form-group select,.form-group textarea{width:100%;padding:11px 13px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:'Crimson Text',serif;font-size:17px;outline:none;transition:border-color .2s;}
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--gold);}
  .form-group select option{background:#1a1c20;}
  .form-group textarea{resize:vertical;min-height:80px;}
  #cat-color-preview{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;color:var(--text-dim);}
  #cat-color-dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.3);flex-shrink:0;}
  .modal-actions{display:flex;gap:12px;margin-top:26px;align-items:center;}
  .btn-primary{flex:1;padding:12px;font-family:'Cinzel',serif;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;background:rgba(201,168,76,.2);border:1px solid var(--gold);color:var(--gold);border-radius:4px;cursor:pointer;transition:all .2s;}
  .btn-primary:hover{background:rgba(201,168,76,.35);}
  .btn-hide{padding:10px 14px;background:transparent;border:1px solid rgba(200,150,0,.35);color:var(--text-dim);border-radius:4px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:8px;font-family:'Cinzel',serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;position:relative;}
  .btn-hide:hover{color:#e67e22;border-color:#e67e22;background:rgba(230,126,34,.08);}
  .btn-hide svg{width:18px;height:18px;flex-shrink:0;}
  .btn-hide .tip{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#1a1c20;border:1px solid var(--border);border-radius:4px;padding:8px 12px;font-size:13px;color:var(--text);white-space:nowrap;pointer-events:none;z-index:10;letter-spacing:0;text-transform:none;font-family:'Crimson Text',serif;}
  .btn-hide:hover .tip{display:block;}
  .leaflet-popup-content-wrapper{background:#131518 !important;border:1px solid var(--border) !important;border-radius:6px !important;color:var(--text) !important;font-family:'Crimson Text',serif !important;box-shadow:0 8px 24px rgba(0,0,0,.7) !important;}
  .leaflet-popup-tip{background:#131518 !important;}
  .leaflet-popup-content{margin:14px 16px !important;font-size:16px !important;}
  .popup-name{font-family:'Cinzel',serif;font-size:16px;color:var(--gold);margin-bottom:4px;}
  .popup-cat{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px;}
  .popup-desc{font-size:16px;line-height:1.4;margin-bottom:10px;}
  .popup-notes-section{border-top:1px solid var(--border);padding-top:10px;margin-top:4px;}
  .popup-notes-title{font-family:'Cinzel',serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px;}
  .popup-note-list{max-height:150px;overflow-y:auto;margin-bottom:10px;}
  .popup-note-item{padding:6px 0;border-bottom:1px solid rgba(180,140,60,.1);}
  .popup-note-item:last-child{border-bottom:none;}
  .popup-note-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;}
  .popup-note-author{font-family:'Cinzel',serif;font-size:12px;color:var(--gold);}
  .popup-note-time{font-size:12px;color:var(--text-dim);}
  .popup-note-text{font-size:15px;line-height:1.4;color:var(--text);}
  .popup-note-empty{font-size:14px;color:var(--text-dim);font-style:italic;padding:4px 0 8px;}
  .popup-note-input{width:100%;padding:7px 9px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:3px;color:var(--text);font-family:'Crimson Text',serif;font-size:15px;outline:none;margin-bottom:6px;transition:border-color .2s;}
  .popup-note-input:focus{border-color:var(--gold);}
  textarea.popup-note-input{resize:none;height:58px;}
  .popup-note-btn{width:100%;padding:7px;font-family:'Cinzel',serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;background:rgba(201,168,76,.08);border:1px solid var(--border);color:var(--text-dim);border-radius:3px;cursor:pointer;transition:all .2s;margin-bottom:10px;}
  .popup-note-btn:hover{color:var(--gold);border-color:var(--gold);background:rgba(201,168,76,.15);}
  .note-acts{display:flex;gap:3px;margin-left:6px;flex-shrink:0;}
  .note-act{background:transparent;border:none;cursor:pointer;color:var(--text-dim);font-size:12px;padding:0 3px;line-height:1;transition:color .15s;opacity:.6;}
  .note-act:hover{opacity:1;} .note-act.edit:hover{color:var(--gold);} .note-act.del:hover{color:#e74c3c;}
  .note-edit-area{width:100%;padding:5px 7px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:3px;color:var(--text);font-family:'Crimson Text',serif;font-size:15px;outline:none;resize:none;height:52px;margin-top:4px;margin-bottom:4px;display:block;}
  .note-edit-area:focus{border-color:var(--gold);}
  .note-edit-btns{display:flex;gap:4px;margin-bottom:4px;}
  .note-edit-save{flex:1;padding:4px 8px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:1px;text-transform:uppercase;background:rgba(201,168,76,.15);border:1px solid var(--gold);color:var(--gold);border-radius:3px;cursor:pointer;transition:all .2s;}
  .note-edit-save:hover{background:rgba(201,168,76,.3);}
  .note-edit-cancel{padding:4px 8px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:1px;text-transform:uppercase;background:transparent;border:1px solid var(--border);color:var(--text-dim);border-radius:3px;cursor:pointer;transition:all .2s;}
  .note-edit-cancel:hover{color:#e74c3c;border-color:#e74c3c;}
  .popup-actions{display:flex;gap:8px;border-top:1px solid var(--border);padding-top:10px;}
  .popup-btn{flex:1;padding:7px 10px;font-family:'Cinzel',serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;border-radius:3px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text-dim);transition:all .2s;}
  .popup-btn:hover{color:var(--gold);border-color:var(--gold);} .popup-btn.danger:hover{color:#e74c3c;border-color:#e74c3c;}
  .map-marker{display:flex;flex-direction:column;align-items:center;pointer-events:none;}
  .marker-pin{border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid rgba(0,0,0,.4);box-shadow:0 2px 6px rgba(0,0,0,.5);}
  .marker-label{font-family:'Crimson Text',serif;font-size:13px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis;margin-top:2px;pointer-events:none;}
  .move-mode #map{cursor:crosshair;}
  #move-banner{display:none;position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:1002;background:rgba(201,168,76,.92);color:#0a0b0e;font-family:'Cinzel',serif;font-size:13px;letter-spacing:1px;padding:8px 20px;border-radius:4px;pointer-events:none;white-space:nowrap;box-shadow:0 2px 12px rgba(0,0,0,.5);}
  #move-banner.show{display:block;}
  /* Auth overlay */
  #auth-overlay{display:none;position:fixed;inset:0;background:#0a0b0e;z-index:9999;align-items:center;justify-content:center;flex-direction:column;}
  #auth-overlay.open{display:flex;}
  #auth-box{background:#131518;border:1px solid var(--border);border-radius:8px;padding:40px 48px;width:380px;max-width:92vw;box-shadow:0 16px 48px rgba(0,0,0,.8);text-align:center;}
  #auth-box h1{font-family:'Cinzel',serif;font-size:20px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:6px;}
  #auth-version{font-family:'Cinzel',serif;font-size:11px;letter-spacing:1.5px;color:var(--text-dim);margin-bottom:4px;}
  #auth-status-line{font-family:'Cinzel',serif;font-size:11px;letter-spacing:1px;color:var(--text-dim);margin-bottom:28px;}
  #auth-status-text.ok{color:#27ae60;} #auth-status-text.busy{color:var(--gold);} #auth-status-text.err{color:#e74c3c;}
  #auth-pass{width:100%;padding:11px 13px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:'Crimson Text',serif;font-size:17px;outline:none;transition:border-color .2s;text-align:center;letter-spacing:2px;margin-bottom:12px;}
  #auth-pass:focus{border-color:var(--gold);}
  #auth-pass::placeholder{letter-spacing:0;color:var(--text-dim);}
  #auth-submit{width:100%;padding:12px;font-family:'Cinzel',serif;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;background:rgba(201,168,76,.2);border:1px solid var(--gold);color:var(--gold);border-radius:4px;cursor:pointer;transition:all .2s;}
  #auth-submit:hover{background:rgba(201,168,76,.35);}
  #auth-error{margin-top:12px;font-size:14px;color:#e74c3c;min-height:20px;}
</style>
</head>
<body>
<div id="auth-overlay" class="open">
  <div id="auth-box">
    <h1>Sardisans Map</h1>
    <div id="auth-version">v1.5.3 b40177</div>
    <div id="auth-status-line">Server: <span id="auth-status-text" class="busy">connecting...</span></div>
    <input type="password" id="auth-pass" placeholder="Enter passphrase..." autocomplete="off">
    <button id="auth-submit">Enter</button>
    <div id="auth-error"></div>
  </div>
</div>
<div id="map-wrap">
  <div id="map"></div>
  <div id="panel">
    <h2>Sardisans Map</h2>
    <div id="right-click-hint">Right-click map to add a marker</div>
    <input type="text" id="name-input" placeholder="Your name..." autocomplete="off">
    <div id="role-row">
      <span id="role-display"></span>
      <button id="logout-btn">Sign Out</button>
    </div>
    <hr class="divider">
    <input type="text" id="search" placeholder="Search markers...">
    <div id="filter-header">
      <span id="filter-header-label">Categories</span>
      <label id="all-toggle-label"><input type="checkbox" class="cat-toggle" id="all-cats-cb" checked> All</label>
    </div>
    <div id="filters"></div>
    <hr class="divider">
    <div id="opacity-row">
      <div id="opacity-row-label">Marker Opacity</div>
      <input type="range" id="opacity-slider" min="0" max="100" value="100">
    </div>
    <hr class="divider">
    <label class="grid-toggle-row">
      <input type="checkbox" class="cat-toggle" id="grid-chk" checked>
      <span>Show grid</span>
    </label>
    <hr class="divider" id="admin-divider">
    <div id="hidden-section">
      <button id="hidden-toggle"><span>Hidden Markers <span id="hidden-count"></span></span><span class="arrow">&#9650;</span></button>
      <div id="hidden-list"><div id="hidden-empty" style="display:none">No hidden markers</div></div>
    </div>
  </div>
  <div id="status"></div>
  <div id="move-banner">&#x1F4CC; Click map to place marker &mdash; Esc to cancel</div>
</div>
<div id="footer">
  <div id="coords-display">—</div>
  <div id="version-display">v1.5.3 b40177 | <span id="sync-text" class="busy">loading...</span></div>
  <div id="zoom-controls">
    <button class="zoom-btn" id="zoom-in">+</button>
    <button class="zoom-btn" id="zoom-out">&minus;</button>
  </div>
</div>
<!-- Debug log panel -->
<div id="debug-panel">
  <div id="debug-header" onclick="document.getElementById('debug-body').classList.toggle('collapsed')">
    <span>DEBUG LOG</span>
    <div style="display:flex;gap:6px;align-items:center">
      <button id="debug-copy" onclick="event.stopPropagation();copyLog()">Copy</button>
      <span style="font-size:10px;color:#666">▲ collapse</span>
    </div>
  </div>
  <div id="debug-body"></div>
</div>
<div id="modal-overlay">
  <div id="modal">
    <button id="modal-close" title="Close">&#x2715;</button>
    <h3 id="modal-title">Place Marker</h3>

    var col=Math.min(GRID_COLS-1,Math.max(0,Math.floor(e.latlng.lng/(MAP_W/GRID_COLS))));
    var row=Math.min(GRID_ROWS,Math.max(1,Math.floor((MAP_H-e.latlng.lat)/(MAP_H/GRID_ROWS))+1));
    document.getElementById('coords-display').textContent=GRID_LETTERS[col]+row+'  x: '+x+'  y: '+y;
  });

  // State
  var currentRole='viewer';
  var markers={},activeCats=new Set(CATEGORIES.map(function(c){return c.id;}));
  var editingId=null,movingId=null,hiddenOpen=false,gridLayer=null,markerOpacity=1.0;

  function getOwned(k){try{return new Set(JSON.parse(localStorage.getItem(k)||'[]'));}catch(e){return new Set();}}
  function addOwned(k,id){var s=getOwned(k);s.add(id);localStorage.setItem(k,JSON.stringify([...s]));}
  function isOwnedMarker(id){return currentRole==='admin'||getOwned('sardisans_mine_m').has(id);}
  function isOwnedNote(id){return currentRole==='admin'||getOwned('sardisans_mine_n').has(id);}
  function isAdmin(){return currentRole==='admin';}
  function canManage(id){return isAdmin()||isOwnedMarker(id);}

  function applyRole(){
    document.getElementById('role-display').textContent=isAdmin()?'Admin':'Viewer';
    document.getElementById('hidden-section').style.display=isAdmin()?'':'none';
    document.getElementById('admin-divider').style.display=isAdmin()?'':'none';
  }
  document.getElementById('logout-btn').onclick=function(){localStorage.removeItem('sardisans_role');location.reload();};

  // Auth
  function checkAuth(){
    var saved=localStorage.getItem('sardisans_role');
    if(saved==='admin'||saved==='viewer'){
      currentRole=saved;
      document.getElementById('auth-overlay').classList.remove('open');
      return true;
    }
    document.getElementById('auth-overlay').classList.add('open');
    return false;
  }
  function tryAuth(){
    var pass=document.getElementById('auth-pass').value.trim();
    var err=document.getElementById('auth-error');
    err.textContent='';
    if(pass===ADMIN_PASS){
      localStorage.setItem('sardisans_role','admin');
      currentRole='admin';
      document.getElementById('auth-overlay').classList.remove('open');
      applyRole();buildFilters();buildGrid();loadMarkers();
    } else if(pass===VIEWER_PASS){
      localStorage.setItem('sardisans_role','viewer');
      currentRole='viewer';
      document.getElementById('auth-overlay').classList.remove('open');
      applyRole();buildFilters();buildGrid();loadMarkers();
    } else {
      err.textContent='Incorrect passphrase.';
      document.getElementById('auth-pass').value='';
      document.getElementById('auth-pass').focus();
    }
  }
  document.getElementById('auth-submit').onclick=tryAuth;
  document.getElementById('auth-pass').addEventListener('keydown',function(e){if(e.key==='Enter')tryAuth();});

  function syncStatus(msg,cls){
    var el=document.getElementById('sync-text');
    if(el){el.textContent=msg;el.className=cls||'busy';}
    var ae=document.getElementById('auth-status-text');
    if(ae){ae.textContent=msg;ae.className=cls||'busy';}
    dlog('Status: '+msg,'info');
  }
  var _ft=null;
  function flash(msg){var el=document.getElementById('status');el.textContent=msg;el.classList.add('show');clearTimeout(_ft);_ft=setTimeout(function(){el.classList.remove('show');},2400);}
  function timeAgo(ts){var d=Math.floor((Date.now()-ts)/1000);if(d<60)return'just now';if(d<3600)return Math.floor(d/60)+'m ago';if(d<86400)return Math.floor(d/3600)+'h ago';return Math.floor(d/86400)+'d ago';}
  function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function getSavedAuthor(){return document.getElementById('name-input').value.trim()||localStorage.getItem('sardisans_author')||'';}

  var ni=document.getElementById('name-input');
  ni.value=localStorage.getItem('sardisans_author')||'';
  ni.oninput=function(){localStorage.setItem('sardisans_author',ni.value.trim());};

  document.getElementById('opacity-slider').oninput=function(){
    markerOpacity=this.value/100;
    Object.values(markers).forEach(function(e){e.leafletMarker.setOpacity(markerOpacity);});
  };

  function buildGrid(){
    if(gridLayer)map.removeLayer(gridLayer);
    gridLayer=L.layerGroup();
    var cw=MAP_W/GRID_COLS,ch=MAP_H/GRID_ROWS;
    for(var c=0;c<GRID_COLS;c++)for(var r=0;r<GRID_ROWS;r++)
      L.rectangle([[MAP_H-(r+1)*ch,c*cw],[MAP_H-r*ch,(c+1)*cw]],{color:'rgba(180,140,60,.18)',weight:1,fill:false,interactive:false}).addTo(gridLayer);
    for(var c=0;c<GRID_COLS;c++)
      L.marker([MAP_H,c*cw+cw/2],{icon:L.divIcon({className:'grid-label',html:GRID_LETTERS[c],iconSize:[30,16],iconAnchor:[15,-2]}),interactive:false}).addTo(gridLayer);
    for(var r=0;r<GRID_ROWS;r++)
      L.marker([MAP_H-(r*ch+ch/2),0],{icon:L.divIcon({className:'grid-label',html:String(r+1),iconSize:[24,16],iconAnchor:[28,8]}),interactive:false}).addTo(gridLayer);
    gridLayer.addTo(map);
    dlog('Grid built','ok');
  }
  document.getElementById('grid-chk').onchange=function(){
    if(this.checked){if(!gridLayer)buildGrid();else gridLayer.addTo(map);}
    else if(gridLayer)map.removeLayer(gridLayer);
  };

  function makeIcon(name,color){
    var s=22;
    return L.divIcon({className:'',html:'<div class="map-marker"><div class="marker-pin" style="background:'+color+';width:'+s+'px;height:'+s+'px;"></div><div class="marker-label">'+(name||'')+'</div></div>',iconSize:[s,s+16],iconAnchor:[s/2,s],popupAnchor:[0,-(s+8)]});
  }

  function addMarkerToMap(d){
    var catDef=CAT_MAP[d.cat]||CAT_MAP['Other'];
    var lm=L.marker([d.y,d.x],{icon:makeIcon(d.name,catDef.color)}).addTo(map);
    lm.setOpacity(markerOpacity);
    lm.bindPopup(function(){return buildPopup(d.id,d,catDef);},{maxWidth:320});
    lm.on('popupopen',function(){
      var el;
      el=document.querySelector('.popup-btn[data-id="'+d.id+'"][data-action="move"]');
      if(el)el.onclick=function(){lm.closePopup();startMoveMode(d.id);};
      el=document.querySelector('.popup-btn[data-id="'+d.id+'"][data-action="edit"]');
      if(el)el.onclick=function(){lm.closePopup();openEditModal(d.id);};
      el=document.querySelector('.popup-btn[data-id="'+d.id+'"][data-action="delete"]');
      if(el)el.onclick=function(){lm.closePopup();confirmDeleteMarker(d.id);};
      var nsb=document.querySelector('[data-action="note-submit"][data-mid="'+d.id+'"]');if(nsb)nsb.onclick=function(){window._sNote(d.id);};
      loadNotes(d.id);
    });
    markers[d.id]={data:d,leafletMarker:lm};
  }

  function buildPopup(id,d,catDef){
    var sid=id.replace(/'/g,"\'");
    var html='<div class="popup-name">'+(d.name||'(Unnamed)')+'</div>'
      +'<div class="popup-cat">'+(catDef?catDef.label:d.cat)+'</div>'
      +(d.descr?'<div class="popup-desc">'+esc(d.descr)+'</div>':'')
      +'<div class="popup-notes-section"><div class="popup-notes-title">Notes</div>'
      +'<div class="popup-note-list" id="nl-'+id+'"><div class="popup-note-empty">Loading...</div></div>'
      +'<input class="popup-note-input" id="na-'+id+'" placeholder="Your name (optional)" value="'+esc(getSavedAuthor())+'">'
      +'<textarea class="popup-note-input" id="nt-'+id+'" placeholder="Add a note..."></textarea>'
      +'<button class="popup-note-btn" data-action="note-submit" data-mid="'+id+'">Post Note</button></div>';
    if(canManage(id)){
      html+='<div class="popup-actions">'
        +'<button class="popup-btn" data-id="'+id+'" data-action="move">Move</button>'
        +'<button class="popup-btn" data-id="'+id+'" data-action="edit">Edit</button>'
        +'<button class="popup-btn danger" data-id="'+id+'" data-action="delete">Delete</button>'
        +'</div>';
    }
    return html;
  }

  async function confirmDeleteMarker(id){
    if(!sb){flash('No DB');return;}
    if(!confirm('Permanently delete this marker?'))return;
    syncStatus('Deleting...','busy');
    var res=await sb.from('markers').delete().eq('id',id);
    if(res.error){syncStatus('Error','err');flash('Delete failed: '+res.error.message);return;}
    if(markers[id]){map.removeLayer(markers[id].leafletMarker);delete markers[id];}
    updateCatCounts();updateVisibility();syncStatus('Live','ok');flash('Marker deleted');
  }

  async function loadNotes(mid){
    if(!sb){var l=document.getElementById('nl-'+mid);if(l)l.innerHTML='<div class="popup-note-empty">No DB</div>';return;}
    var res=await sb.from('notes').select('*').eq('marker_id',mid).order('ts',{ascending:true});
    var l2=document.getElementById('nl-'+mid);if(!l2)return;
    if(res.error||!res.data||!res.data.length){
      l2.innerHTML='<div class="popup-note-empty">'+(res.error?'Error: '+res.error.message:'No notes yet')+'</div>';return;
    }
    l2.innerHTML=res.data.map(function(n){
      var acts=isOwnedNote(n.id)?'<span class="note-acts"><button class="note-act edit" data-action="note-edit" data-nid="'+n.id+'" data-mid="'+mid+'">&#9998;</button><button class="note-act del" data-action="note-del" data-nid="'+n.id+'" data-mid="'+mid+'">&#x2715;</button></span>':'';
      return '<div class="popup-note-item" id="ni-'+n.id+'"><div class="popup-note-meta"><span class="popup-note-author">'+esc(n.author||'Anonymous')+'</span><span style="display:flex;align-items:center"><span class="popup-note-time">'+timeAgo(n.ts)+'</span>'+acts+'</span></div><div class="popup-note-text" id="nt-text-'+n.id+'">'+esc(n.content)+'</div></div>';
    }).join('');
    l2.scrollTop=l2.scrollHeight;
    l2.onclick=function(e){var btn=e.target.closest('[data-action]');if(!btn)return;var nid=btn.dataset.nid,mid2=btn.dataset.mid;if(btn.dataset.action==='note-edit')window._eNote(nid,mid2);if(btn.dataset.action==='note-del')window._dNote(nid,mid2);};
  }
  window._sNote=async function(mid){
    if(!sb){flash('No DB');return;}
    var ae=document.getElementById('na-'+mid),te=document.getElementById('nt-'+mid);
    if(!ae||!te)return;
    var content=te.value.trim();if(!content){te.focus();return;}
    var author=ae.value.trim()||'Anonymous';
    localStorage.setItem('sardisans_author',ae.value.trim());te.value='';
    var nid='n_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    var res=await sb.from('notes').insert({id:nid,marker_id:mid,content:content,author:author,ts:Date.now()});
    if(!res.error){addOwned('sardisans_mine_n',nid);loadNotes(mid);}
    else dlog('Note insert error: '+res.error.message,'err');
  };
  window._eNote=function(nid,mid){
    var textEl=document.getElementById('nt-text-'+nid);if(!textEl)return;
    var cur=textEl.textContent;textEl.style.display='none';
    var ta=document.createElement('textarea');ta.className='note-edit-area';ta.value=cur;ta.id='ne-'+nid;
    var btns=document.createElement('div');btns.className='note-edit-btns';
    var save=document.createElement('button');save.className='note-edit-save';save.textContent='Save';
    save.onclick=async function(){
      if(!sb)return;var c=ta.value.trim();if(!c)return;
      var r=await sb.from('notes').update({content:c}).eq('id',nid);
      if(r.error){flash('Save failed');return;}loadNotes(mid);
    };
    var cancel=document.createElement('button');cancel.className='note-edit-cancel';cancel.textContent='Cancel';
    cancel.onclick=function(){ta.remove();btns.remove();textEl.style.display='';};
    btns.append(save,cancel);
    var item=document.getElementById('ni-'+nid);item.appendChild(ta);item.appendChild(btns);
    ta.focus();
  };
  window._dNote=async function(nid,mid){
    if(!sb||!confirm('Delete note?'))return;
    var r=await sb.from('notes').delete().eq('id',nid);
    if(r.error){flash('Delete failed');return;}loadNotes(mid);
  };

  function startMoveMode(id){movingId=id;document.getElementById('map-wrap').classList.add('move-mode');document.getElementById('move-banner').classList.add('show');}
  function cancelMoveMode(){movingId=null;document.getElementById('map-wrap').classList.remove('move-mode');document.getElementById('move-banner').classList.remove('show');}

  map.on('contextmenu',function(e){if(movingId)return;openAddModal({x:Math.round(e.latlng.lng),y:Math.round(e.latlng.lat)});});
  map.on('click',function(e){
    if(!movingId)return;
    var id=movingId;cancelMoveMode();
    var entry=markers[id];if(!entry)return;
    var nx=Math.round(e.latlng.lng),ny=Math.round(e.latlng.lat);
    var d=Object.assign({},entry.data,{x:nx,y:ny});
    map.removeLayer(entry.leafletMarker);delete markers[id];
    addMarkerToMap(d);updateVisibility();
    if(!sb){flash('Moved (no DB)');return;}
    syncStatus('Saving...','busy');
    sb.from('markers').update({x:nx,y:ny}).eq('id',id).then(function(r){
      if(r.error){syncStatus('Error','err');dlog('Move error: '+r.error.message,'err');}
      else{syncStatus('Live','ok');flash('Marker moved');}
    });
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeModal();cancelMoveMode();}});

  function openAddModal(coords){
    editingId=null;
    document.getElementById('modal-title').textContent='Place Marker';
    document.getElementById('modal-x').value=coords.x;document.getElementById('modal-y').value=coords.y;
    document.getElementById('m-name').value='';document.getElementById('m-cat').value='POI';document.getElementById('m-desc').value='';
    document.getElementById('btn-hide-marker').style.display='none';
    onCatChange();document.getElementById('modal-overlay').classList.add('open');
    setTimeout(function(){document.getElementById('m-name').focus();},50);
  }
  function openEditModal(id){
    var entry=markers[id];if(!entry)return;var d=entry.data;editingId=id;
    document.getElementById('modal-title').textContent='Edit Marker';
    document.getElementById('modal-x').value=d.x;document.getElementById('modal-y').value=d.y;
    document.getElementById('m-name').value=d.name;document.getElementById('m-cat').value=d.cat;document.getElementById('m-desc').value=d.descr||'';
    document.getElementById('btn-hide-marker').style.display=isAdmin()?'':'none';
    onCatChange();document.getElementById('modal-overlay').classList.add('open');
    setTimeout(function(){document.getElementById('m-name').focus();},50);
  }
  function closeModal(){document.getElementById('modal-overlay').classList.remove('open');editingId=null;}
  function onCatChange(){var def=CAT_MAP[document.getElementById('m-cat').value]||CAT_MAP['Other'];document.getElementById('cat-color-dot').style.background=def.color;document.getElementById('cat-color-label').textContent=def.label;}

  document.getElementById('modal-close').onclick=closeModal;
  document.getElementById('m-cat').onchange=onCatChange;
  document.getElementById('modal-overlay').onclick=function(e){if(e.target===this)closeModal();};
  document.getElementById('btn-hide-marker').onclick=function(){if(editingId)hideMarkerById(editingId);closeModal();};
  document.getElementById('btn-save-marker').onclick=async function(){
    if(!sb){flash('No DB connection');return;}
    var name=document.getElementById('m-name').value.trim();if(!name){document.getElementById('m-name').focus();return;}
    var wasEditing=editingId;
    var row={id:wasEditing||('m_'+Date.now()+'_'+Math.random().toString(36).slice(2)),name:name,cat:document.getElementById('m-cat').value,descr:document.getElementById('m-desc').value.trim(),x:parseInt(document.getElementById('modal-x').value),y:parseInt(document.getElementById('modal-y').value),hidden:false,ts:Date.now()};
    if(markers[row.id]){map.removeLayer(markers[row.id].leafletMarker);delete markers[row.id];}
    addMarkerToMap(row);updateCatCounts();updateVisibility();closeModal();
    syncStatus('Saving...','busy');
    var payload={name:row.name,cat:row.cat,descr:row.descr,x:row.x,y:row.y,hidden:row.hidden,ts:row.ts};
    var res=wasEditing?await sb.from('markers').update(payload).eq('id',row.id):await sb.from('markers').insert(row);
    if(res.error){if(markers[row.id]){map.removeLayer(markers[row.id].leafletMarker);delete markers[row.id];}updateCatCounts();syncStatus('Error','err');dlog('Save error: '+res.error.message,'err');}
    else{if(!wasEditing)addOwned('sardisans_mine_m',row.id);syncStatus('Live','ok');flash('Marker saved');}
  };

  async function hideMarkerById(id){
    if(!sb){flash('No DB');return;}
    syncStatus('Saving...','busy');
    var res=await sb.from('markers').update({hidden:true}).eq('id',id);
    if(res.error){syncStatus('Error','err');dlog('Hide error: '+res.error.message,'err');return;}
    if(markers[id]){map.removeLayer(markers[id].leafletMarker);delete markers[id];}
    updateCatCounts();updateVisibility();syncStatus('Live','ok');flash('Marker hidden');
    if(hiddenOpen)loadHiddenMarkers();
  }

  function updateVisibility(){
    var q=document.getElementById('search').value.trim().toLowerCase();
    Object.values(markers).forEach(function(e){
      var ok=activeCats.has(e.data.cat)&&(!q||e.data.name.toLowerCase().includes(q)||(e.data.descr||'').toLowerCase().includes(q));
      if(ok)e.leafletMarker.addTo(map);else map.removeLayer(e.leafletMarker);
    });
  }
  function updateCatCounts(){
    CATEGORIES.forEach(function(c){var el=document.getElementById('count-'+c.id);if(el)el.textContent=Object.values(markers).filter(function(e){return e.data.cat===c.id;}).length;});
  }
  document.getElementById('all-cats-cb').onchange=function(){
    var checked=this.checked;
    CATEGORIES.forEach(function(c){checked?activeCats.add(c.id):activeCats.delete(c.id);});
    document.querySelectorAll('.cat-item-cb').forEach(function(cb){cb.checked=checked;});
    updateVisibility();
  };
  document.getElementById('search').oninput=updateVisibility;

  function buildFilters(){
    var container=document.getElementById('filters');
    CATEGORIES.forEach(function(cat){
      var row=document.createElement('div');row.className='cat-row';
      var cb=document.createElement('input');cb.type='checkbox';cb.className='cat-toggle cat-item-cb';cb.checked=true;
      cb.onchange=function(){
        if(cb.checked)activeCats.add(cat.id);else activeCats.delete(cat.id);
        document.getElementById('all-cats-cb').checked=CATEGORIES.every(function(c){return activeCats.has(c.id);});
        updateVisibility();
      };
      var dot=document.createElement('div');dot.className='cat-dot';dot.style.background=cat.color;
      var lbl=document.createElement('span');lbl.textContent=cat.label;
      var cnt=document.createElement('span');cnt.className='cat-count';cnt.id='count-'+cat.id;cnt.textContent='0';
      row.append(cb,dot,lbl,cnt);
      row.onclick=function(ev){if(ev.target!==cb){cb.checked=!cb.checked;cb.dispatchEvent(new Event('change'));}};
      container.appendChild(row);
    });
    dlog('Filters built','ok');
  }

  document.getElementById('hidden-toggle').onclick=function(){
    hiddenOpen=!hiddenOpen;
    this.classList.toggle('open',hiddenOpen);
    document.getElementById('hidden-list').classList.toggle('open',hiddenOpen);
    if(hiddenOpen)loadHiddenMarkers();
  };

  async function loadHiddenMarkers(){
    if(!sb)return;
    var list=document.getElementById('hidden-list'),empty=document.getElementById('hidden-empty');
    Array.from(list.querySelectorAll('.hidden-item')).forEach(function(el){el.remove();});
    var res=await sb.from('markers').select('*').eq('hidden',true).order('ts',{ascending:false});
    if(res.error||!res.data)return;
    document.getElementById('hidden-count').textContent=res.data.length?'('+res.data.length+')':'';
    empty.style.display=res.data.length?'none':'block';
    res.data.forEach(function(d){
      var catDef=CAT_MAP[d.cat]||CAT_MAP['Other'];
      var item=document.createElement('div');item.className='hidden-item';
      var dot=document.createElement('div');dot.className='hidden-item-dot';dot.style.background=catDef.color;
      var name=document.createElement('span');name.className='hidden-item-name';name.textContent=d.name||'(Unnamed)';
      var btns=document.createElement('div');btns.className='hidden-item-btns';
      var rb=document.createElement('button');rb.className='hi-btn restore';rb.textContent='Restore';
      rb.onclick=async function(){
        if(!sb)return;syncStatus('Saving...','busy');
        var r=await sb.from('markers').update({hidden:false}).eq('id',d.id);
        if(r.error){syncStatus('Error','err');return;}
        d.hidden=false;addMarkerToMap(d);updateCatCounts();updateVisibility();
        syncStatus('Live','ok');flash('Restored');loadHiddenMarkers();
      };
      var db=document.createElement('button');db.className='hi-btn del';db.textContent='Delete';
      db.onclick=async function(){
        if(!sb||!confirm('Permanently delete?'))return;
        syncStatus('Deleting...','busy');
        var r=await sb.from('markers').delete().eq('id',d.id);
        if(r.error){syncStatus('Error','err');return;}
        syncStatus('Live','ok');flash('Deleted');loadHiddenMarkers();
      };
      btns.append(rb,db);item.append(dot,name,btns);list.appendChild(item);
    });
  }

  async function loadMarkers(){
    if(!sb){syncStatus('No DB','err');dlog('loadMarkers: sb is null','err');return;}
    syncStatus('Loading...','busy');
    dlog('Fetching markers from Supabase...','info');
    try{
      var res=await sb.from('markers').select('*').eq('hidden',false);
      if(res.error){syncStatus('DB Error','err');dlog('Markers fetch error: '+res.error.message,'err');return;}
      Object.values(markers).forEach(function(e){map.removeLayer(e.leafletMarker);});
      markers={};
      (res.data||[]).forEach(function(d){addMarkerToMap(d);});
      updateCatCounts();updateVisibility();
      syncStatus('Live','ok');
      dlog('Loaded '+(res.data||[]).length+' markers','ok');
    } catch(e){
      syncStatus('Error','err');
      dlog('loadMarkers exception: '+e.message,'err');
    }
  }

  // Boot
  if(checkAuth()){
    applyRole();
    buildFilters();
    buildGrid();
    loadMarkers();
    dlog('Boot complete','ok');
  } else {
    dlog('Auth required — waiting for passphrase','info');
  }
});
</script>
</body>
</html>
